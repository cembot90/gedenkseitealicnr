<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>In Erinnerung an Ali Çinar</title>
  <meta name="description" content="Gedenkseite für Ali Çinar">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0d0e10">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://www.recaptcha.net; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com; frame-src https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#jahrestag">Zum Inhalt</a>

  <header class="nav">
    <a class="nav__name" href="#top">Ali Çinar</a>
    <nav class="nav__links" aria-label="Hauptnavigation">
      <a href="#jahrestag" data-i18n="navYear"></a>
      <a href="#leben" data-i18n="navLife"></a>
      <a href="#erinnerungen" data-i18n="navMemories"></a>
      <a href="#worte" data-i18n="navWords"></a>
      <a href="#bilder" data-i18n="navGallery"></a>
      <a href="#gedenkbuch" data-i18n="navBook"></a>
    </nav>
    <div class="seg-switch" role="group" aria-label="Sprache / Dil">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="tr" aria-pressed="false">TR</button>
    </div>
  </header>

  <main id="top">
    <!-- 1 · Auftakt: Porträt zieht sich beim Scrollen zurück -->
    <section class="hero scene" data-scene>
      <div class="stage">
        <div class="hero__portrait" id="portrait"><div class="portrait__img"></div></div>
        <div class="hero__text">
          <p class="hero__lead" data-i18n="inMemory"></p>
          <h1 class="hero__name" id="heroName"></h1>
          <p class="hero__role" id="heroNick"></p>
          <p class="hero__dates"><span id="born"></span><span class="hero__dash" aria-hidden="true"></span><span id="died"></span></p>
          <p class="hero__places" id="places"></p>
        </div>
        <span class="hero__cue" aria-hidden="true"></span>
      </div>
    </section>

    <!-- 2 · Seine Worte, Wort für Wort -->
    <section class="words scene" data-scene>
      <div class="stage">
        <p class="words__line" id="wordsLine" lang="tr"></p>
        <p class="words__meaning" id="wordsMeaning"></p>
        <p class="words__after" id="wordsAfter"></p>
      </div>
    </section>

    <!-- 3 · Ein Jahr ohne dich -->
    <section class="year" id="jahrestag">
      <div class="col">
        <h2 class="year__title" id="annTitle"></h2>
        <p class="year__kicker" id="annEyebrow"></p>
        <div class="year__body" id="annBody"></div>
        <p class="year__reflection" id="annReflection"></p>
        <div class="year__close">
          <p id="annBlessing"></p>
          <p class="year__devr" lang="tr">Devr-i Daim. Işıklar yoldaşın olsun.</p>
          <p class="year__sign"><span id="annClosing"></span><br><strong id="annSignature"></strong></p>
        </div>
      </div>
    </section>

    <!-- 4 · Lebensweg -->
    <section class="life" id="leben">
      <div class="col">
        <p class="intro" id="intro"></p>
        <h2 class="h2" data-i18n="lifeTitle"></h2>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- 5 · Fröhliche Erinnerungen: bildschirmfüllende Fotos, die mitgehen -->
    <section class="moments" id="erinnerungen">
      <div class="col moments__head">
        <h2 class="h2 h2--color" data-i18n="memTitle"></h2>
        <p class="sub" data-i18n="memEyebrow"></p>
      </div>
      <div id="memories"></div>
    </section>

    <!-- 6 · Worte für ihn -->
    <section class="speak" id="worte">
      <div class="col">
        <h2 class="h2" data-i18n="wordsTitle"></h2>
        <p class="sub" data-i18n="wordsEyebrow"></p>
        <div id="speeches"></div>
      </div>
    </section>

    <!-- 7 · Galerie: fährt beim Scrollen seitlich durch -->
    <section class="reel scene" id="bilder" data-scene>
      <div class="stage">
        <div class="reel__head col">
          <h2 class="h2" data-i18n="galleryTitle"></h2>
        </div>
        <div class="reel__track" id="gallery"></div>
      </div>
    </section>

    <!-- 8 · Lichter -->
    <section class="lights" id="kerzen">
      <div class="col">
        <h2 class="h2" data-i18n="candlesTitle"></h2>
        <p class="sub" id="candleCount" aria-live="polite"></p>
        <div class="candlefield" id="candles"></div>
        <button class="btn btn--primary" type="button" data-action="candle"><span data-i18n="lightCandle"></span></button>
      </div>
    </section>

    <!-- 9 · Gedenkbuch -->
    <section class="book" id="gedenkbuch">
      <div class="col book__grid">
        <div class="book__form">
          <h2 class="h2" data-i18n="bookTitle"></h2>
          <p class="sub" data-i18n="bookIntro"></p>
          <p class="demo-note" id="demoNote" hidden data-i18n="demo"></p>
          <form id="bookForm" novalidate>
            <label class="field">
              <span data-i18n="fName"></span>
              <input name="name" maxlength="60" autocomplete="name">
            </label>
            <label class="field">
              <span data-i18n="fRelation"></span>
              <input name="relation" maxlength="60">
            </label>
            <label class="field">
              <span data-i18n="fMessage"></span>
              <textarea name="message" rows="6" maxlength="1500" required></textarea>
              <small class="counter"><output id="msgCount">0</output> / 1500</small>
            </label>
            <label class="consent">
              <input type="checkbox" name="consent" required>
              <span><span data-i18n="fConsent"></span> <a href="datenschutz.html" data-i18n="privacy"></a></span>
            </label>
            <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
            <button class="btn btn--primary btn--wide" type="submit" data-i18n="fSubmit"></button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          </form>
        </div>
        <div class="book__entries" id="entries" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__name" id="footName"></p>
    <p class="footer__family" id="footFamily"></p>
    <nav class="footer__legal" aria-label="Rechtliches"><a href="impressum.html" data-i18n="imprint"></a><a href="datenschutz.html" data-i18n="privacy"></a></nav>
  </footer>

  <button class="music" type="button" id="musicBtn" aria-pressed="false">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="music__label" id="musicLabel"></span>
  </button>
  <audio id="bgMusic" preload="auto" loop></audio>

  <dialog id="candleDialog" class="dialog">
    <form method="dialog" id="candleForm">
      <div class="dialog__flame" aria-hidden="true"><span class="candle"><span class="flame"></span></span></div>
      <label class="field">
        <span data-i18n="candleNameLabel"></span>
        <input name="cname" maxlength="40" autocomplete="name">
      </label>
      <div class="dialog__actions">
        <button class="btn btn--ghost" value="cancel" data-i18n="cancel"></button>
        <button class="btn btn--silver" value="ok" data-i18n="candleConfirm"></button>
      </div>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <button class="lightbox__close" type="button" aria-label="Schließen">×</button>
    <img alt="">
    <video controls playsinline preload="none" hidden></video>
    <p class="lightbox__cap"></p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
  <script type="module" src="assets/js/store.js"></script>
</body>
</html>
