<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>In Erinnerung an Ali Çinar</title>
  <meta name="description" content="Gedenkseite für Ali Çinar">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0d0e10">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://www.recaptcha.net; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com; frame-src https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#jahrestag">Zum Inhalt</a>
  <canvas id="dust" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="mark" href="#top" aria-label="Nach oben">AÇ</a>
    <nav class="nav" aria-label="Hauptnavigation">
      <a href="#jahrestag" data-i18n="navYear"></a>
      <a href="#leben" data-i18n="navLife"></a>
      <a href="#erinnerungen" data-i18n="navMemories"></a>
      <a href="#worte" data-i18n="navWords"></a>
      <a href="#bilder" data-i18n="navGallery"></a>
      <a href="#gedenkbuch" data-i18n="navBook"></a>
    </nav>
    <div class="lang" role="group" aria-label="Sprache / Dil">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="tr" aria-pressed="false">TR</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero__inner">
        <p class="eyebrow" data-i18n="inMemory"></p>
        <div class="portrait" id="portrait" aria-hidden="true">
          <div class="portrait__ring"></div>
          <div class="portrait__img"></div>
        </div>
        <h1 class="hero__name silver" id="heroName"></h1>
        <p class="hero__nick" id="heroNick"></p>
        <p class="hero__dates"><span id="born"></span><span class="sep" aria-hidden="true"></span><span id="died"></span></p>
        <p class="hero__places" id="places"></p>
        <blockquote class="hero__quote">
          <p id="quote"></p>
          <cite id="quoteSource"></cite>
        </blockquote>
        <button class="btn btn--silver" type="button" data-action="candle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1.6 2.4 3 4.2 3 6a3 3 0 0 1-6 0c0-1.8 1.4-3.6 3-6Z"/><rect x="10" y="12" width="4" height="10" rx="1"/></svg>
          <span data-i18n="lightCandle"></span>
        </button>
      </div>
      <a class="scrollcue" href="#jahrestag"><span data-i18n="scroll"></span><i aria-hidden="true"></i></a>
    </section>

    <section class="section anniv" id="jahrestag">
      <div class="wrap">
        <article class="letter reveal">
          <p class="eyebrow" id="annEyebrow"></p>
          <h2 class="letter__title" id="annTitle"></h2>
          <div class="letter__body" id="annBody"></div>
          <p class="letter__reflection" id="annReflection"></p>
          <p class="letter__blessing" id="annBlessing"></p>
          <p class="letter__blessing letter__blessing--tr">Devr-i Daim. Işıklar yoldaşın olsun.</p>
          <p class="letter__closing" id="annClosing"></p>
          <p class="letter__signature silver" id="annSignature"></p>
          <a class="letter__link" href="#worte"><span data-i18n="speechLink"></span><i aria-hidden="true">→</i></a>
        </article>
      </div>
    </section>

    <section class="section" id="leben">
      <div class="wrap narrow">
        <p class="intro reveal" id="intro"></p>
      </div>
      <div class="wrap">
        <header class="shead reveal">
          <p class="eyebrow" data-i18n="lifeEyebrow"></p>
          <h2 data-i18n="lifeTitle"></h2>
        </header>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section class="section memories" id="erinnerungen">
      <div class="memories__glow" aria-hidden="true"></div>
      <div class="wrap">
        <header class="shead reveal">
          <p class="eyebrow" data-i18n="memEyebrow"></p>
          <h2 data-i18n="memTitle"></h2>
        </header>
        <div class="memgrid" id="memories"></div>
      </div>
    </section>

    <section class="section" id="worte">
      <div class="wrap">
        <header class="shead reveal">
          <p class="eyebrow" data-i18n="wordsEyebrow"></p>
          <h2 data-i18n="wordsTitle"></h2>
        </header>
        <div class="speeches" id="speeches"></div>
      </div>
    </section>

    <section class="section" id="bilder">
      <div class="wrap">
        <header class="shead reveal">
          <p class="eyebrow" data-i18n="galleryEyebrow"></p>
          <h2 data-i18n="galleryTitle"></h2>
        </header>
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <section class="section candles" id="kerzen">
      <div class="wrap">
        <header class="shead reveal">
          <p class="eyebrow" data-i18n="candlesEyebrow"></p>
          <h2 data-i18n="candlesTitle"></h2>
        </header>
        <p class="candles__count" id="candleCount" aria-live="polite"></p>
        <div class="candlefield" id="candles"></div>
        <div class="center">
          <button class="btn btn--silver" type="button" data-action="candle"><span data-i18n="lightCandle"></span></button>
        </div>
      </div>
    </section>

    <section class="section" id="gedenkbuch">
      <div class="wrap book">
        <div class="book__form reveal">
          <p class="eyebrow" data-i18n="bookEyebrow"></p>
          <h2 data-i18n="bookTitle"></h2>
          <p class="muted" data-i18n="bookIntro"></p>
          <p class="demo-note" id="demoNote" hidden data-i18n="demo"></p>
          <form id="bookForm" novalidate>
            <label class="field">
              <span data-i18n="fName"></span>
              <input name="name" maxlength="60" autocomplete="name">
            </label>
            <label class="field">
              <span data-i18n="fRelation"></span>
              <input name="relation" maxlength="60">
            </label>
            <label class="field">
              <span data-i18n="fMessage"></span>
              <textarea name="message" rows="6" maxlength="1500" required></textarea>
              <small class="counter"><output id="msgCount">0</output> / 1500</small>
            </label>
            <label class="consent">
              <input type="checkbox" name="consent" required>
              <span><span data-i18n="fConsent"></span> <a href="datenschutz.html" data-i18n="privacy"></a></span>
            </label>
            <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
            <button class="btn btn--solid" type="submit" data-i18n="fSubmit"></button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          </form>
        </div>
        <div class="book__entries" id="entries" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="silver footer__name" id="footName"></p>
    <p class="muted" id="footFamily"></p>
    <nav class="legal" aria-label="Rechtliches"><a href="impressum.html" data-i18n="imprint"></a><a href="datenschutz.html" data-i18n="privacy"></a></nav>
  </footer>

  <button class="music" type="button" id="musicBtn" aria-pressed="false">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="music__label" id="musicLabel"></span>
  </button>
  <audio id="bgMusic" preload="none" loop></audio>

  <dialog id="candleDialog" class="dialog">
    <form method="dialog" id="candleForm">
      <div class="dialog__flame" aria-hidden="true"><span class="candle"><span class="flame"></span></span></div>
      <label class="field">
        <span data-i18n="candleNameLabel"></span>
        <input name="cname" maxlength="40" autocomplete="name">
      </label>
      <div class="dialog__actions">
        <button class="btn btn--ghost" value="cancel" data-i18n="cancel"></button>
        <button class="btn btn--silver" value="ok" data-i18n="candleConfirm"></button>
      </div>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <button class="lightbox__close" type="button" aria-label="Schließen">×</button>
    <img alt="">
    <video controls playsinline preload="none" hidden></video>
    <p class="lightbox__cap"></p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
  <script type="module" src="assets/js/store.js"></script>
</body>
</html>
